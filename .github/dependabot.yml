# Dependabot configuration for SecPal Contracts (OpenAPI specs)
# Automatically creates PRs for ALL dependency updates (including Major versions)
# Security updates are prioritized and checked daily in early morning hours
version: 2
updates:
  # GitHub Actions - Workflow dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'Europe/Berlin'
    groups:
      shared-workflow-pins:
        patterns: ['SecPal/.github*']
      github-actions-patch:
        patterns: ['*']
        exclude-patterns: ['SecPal/.github*']
        update-types: ['patch']
      github-actions-minor:
        patterns: ['*']
        exclude-patterns: ['SecPal/.github*']
        update-types: ['minor']
      github-actions-major:
        patterns: ['*']
        exclude-patterns: ['SecPal/.github*']
        update-types: ['major']
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'dependabot'
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    target-branch: 'main'
    pull-request-branch-name:
      separator: '-'

  # npm - JavaScript/TypeScript dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'Europe/Berlin'
    versioning-strategy: 'increase'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
      - 'dependabot'
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    target-branch: 'main'
    pull-request-branch-name:
      separator: '-'

  # Remote hooks require manual review; explicit labels replace defaults.
  - package-ecosystem: 'pre-commit'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'Europe/Berlin'
    labels:
      - 'developer-experience'
      - 'dependabot'
