# Dependabot Auto-Merge Workflow (Contracts Repository)
# Uses the centralized reusable workflow from .github repository
#
# For implementation details, see:
# SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml

name: Dependabot Auto-Merge

on:
  # Only the accepted immutable callee runs; no PR-controlled source is executed.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
      - converted_to_draft

# Ensure only one auto-merge runs at a time per PR
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required permissions for dependabot auto-merge
cache-mode: none

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@76c2a50b4a8232ae3fbbfa81d48c0ee0e0a7d01d # main
    with:
      allowed-ecosystems: 'github_actions,npm_and_yarn,pre_commit'
      pre-commit-path: '.pre-commit-config.yaml'
      shared-sha-workflow-paths: >-
        [".github/workflows/check-conflict-markers.yml",".github/workflows/pr-size.yml"]
      phase: '2' # Verified PATCH and MINOR; Source Safety must be required
      merge-method: 'squash' # Use squash merge for cleaner history
