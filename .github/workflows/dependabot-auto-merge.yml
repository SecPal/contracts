# Dependabot Auto-Merge Workflow (Contracts Repository)
# Uses the centralized reusable workflow from .github repository
#
# For implementation details, see:
# SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml

name: Dependabot Auto-Merge

on:
  # Only the accepted immutable callee runs; no PR-controlled source is executed.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
      - converted_to_draft

# Ensure only one auto-merge runs at a time per PR
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required permissions for dependabot auto-merge
cache-mode: none

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@cab90e4575c15a116afce584082b5830ca68102d # main
    with:
      allowed-ecosystems: 'github_actions,npm_and_yarn'
      phase: '1' # Phase 1: Only PATCH updates auto-merge
      merge-method: 'squash' # Use squash merge for cleaner history
