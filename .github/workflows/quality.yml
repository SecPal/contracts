---
name: Code Quality

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  dependabot-manifests:
    name: Dependabot Manifest Guard
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-manifest-coverage.yml@d3044d801cacb5aebf87d42744e918128c115207 # main

  reuse:
    name: REUSE Compliance
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@923dc37b3691f7abb04b8a1c87dfbbcffbd8e0f6 # main

  license-compatibility:
    name: License Compatibility
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@1010593808ca85a67f8ae66af79b8b256a586f63 # main

  prettier:
    name: Prettier Formatting
    uses: ./.github/workflows/local-prettier.yml

  markdown-lint:
    name: Markdown Lint
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@d3044d801cacb5aebf87d42744e918128c115207 # main
    with:
      # yamllint disable-line rule:line-length
      governance-ref: '6f8e13a7a62cee356811a7f58d6b92119941652f'

  ai-instructions:
    name: AI Instructions
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@1010593808ca85a67f8ae66af79b8b256a586f63 # main

  openapi-lint:
    name: OpenAPI Lint
    uses: ./.github/workflows/local-openapi-lint.yml

  actionlint:
    name: Actionlint
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-actionlint.yml@d3044d801cacb5aebf87d42744e918128c115207 # main
