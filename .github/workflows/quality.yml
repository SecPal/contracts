---
name: Code Quality

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  dependabot-manifests:
    name: Dependabot Manifest Guard
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-manifest-coverage.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main

  reuse:
    name: REUSE Compliance
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main

  license-compatibility:
    name: License Compatibility
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main

  prettier:
    name: Prettier Formatting
    uses: ./.github/workflows/local-prettier.yml

  markdown-lint:
    name: Markdown Lint
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main
    with:
      # yamllint disable-line rule:line-length
      governance-ref: '6f8e13a7a62cee356811a7f58d6b92119941652f'

  ai-instructions:
    name: AI Instructions
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main

  openapi-lint:
    name: OpenAPI Lint
    uses: ./.github/workflows/local-openapi-lint.yml

  actionlint:
    name: Actionlint
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-actionlint.yml@35b064b1df08f4fd02fb982117dadac3e4edc36d # main
