on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@b58f918f6d2ef4c395cc18d490766d5c2045f9f7 # main
    with:
      max-lines: 600
      exclude-patterns: ''
