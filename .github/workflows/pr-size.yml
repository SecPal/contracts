on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@a6c3ca8978f9d81e9f49a5fe14cbc3d17528f2bf # main
    with:
      max-lines: 600
      exclude-patterns: ''
