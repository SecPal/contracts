on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@7fdaab85dff93b486f5f4af67108f01e09a2c0d4 # main
    with:
      max-lines: 600
      exclude-patterns: ''
