on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@243fc1357bc1e81977839586bcff7dacb1d69d78 # v1.1.1
    with:
      max-lines: 600
      exclude-patterns: ''
