on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@76c2a50b4a8232ae3fbbfa81d48c0ee0e0a7d01d # main
    with:
      max-lines: 600
      exclude-patterns: ''
