on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@500c12b585d8265e1f52936c72764ec2a0d98ad1 # main
    with:
      max-lines: 600
      exclude-patterns: ''
