on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@da7d5f19a1ff4e65bfdbe7ad0a66e13f6172ada9 # main
    with:
      max-lines: 600
      exclude-patterns: ''
