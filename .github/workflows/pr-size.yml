on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@daea9e2a5d033affbda1cb52d27afb491e703aa4 # main
    with:
      max-lines: 600
      exclude-patterns: ''
