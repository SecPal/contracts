on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@eefac02583d4c50c77323c0200745ab4fb988fa1 # main
    with:
      max-lines: 600
      exclude-patterns: ''
