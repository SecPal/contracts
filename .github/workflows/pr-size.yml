on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@ffdfe1be8bbd8164d649f1c1d296e57ff4c6cc4a # main
    with:
      max-lines: 600
      exclude-patterns: ''
