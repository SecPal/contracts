on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@094e2c721aac83e4b0372e6edd6e7eefd0cea32b # main
    with:
      max-lines: 600
      exclude-patterns: ''
