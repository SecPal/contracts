on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-size:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-pr-size.yml@56f7ee88608c46e51da8641328d34cadcf299408 # v1.1.2
    with:
      max-lines: 600
      exclude-patterns: ''
