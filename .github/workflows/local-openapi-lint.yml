---
name: Local OpenAPI Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  openapi-lint:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan repository security
        id: repository-security
        # yamllint disable-line rule:line-length
        uses: SecPal/.github/.github/actions/trivy-repository-scan@f94b47c6a44f924b11b2802ac1c334f20b2e93a9 # main

      - name: Require clean repository security
        if: ${{ always() }}
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.repository-security.outcome }}
          GATE_STATE: ${{ steps.repository-security.outputs.gate-state }}
        run: |
          test "$SCAN_OUTCOME" = success
          test "$GATE_STATE" = CLEAN

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI specification
        run: npm run lint
